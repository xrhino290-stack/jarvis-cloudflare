<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<title>JARVIS</title>
<style>
:root{--bg:#02060c;--c:#2bd4ff;--c2:#0b6fa8;--t:#8fdcff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.bar{display:flex;gap:6px;padding:12px 0 4px;flex-wrap:wrap;justify-content:center;z-index:3}
.b{background:transparent;border:1px solid var(--c2);color:var(--t);padding:8px 11px;font-size:11px;letter-spacing:.12em;cursor:pointer;border-radius:2px;transition:.2s}
.b.on{border-color:var(--c);box-shadow:0 0 14px rgba(43,212,255,.5);background:rgba(43,212,255,.08);color:#d6f6ff}
.b:disabled{opacity:.35}
#net{font-size:10px;letter-spacing:.2em;color:#ffb86b;height:12px;z-index:3}
#stage{flex:1;width:100%;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#out{width:100%;max-width:640px;min-height:72px;max-height:21vh;overflow-y:auto;text-align:center;font-size:14px;line-height:1.5;letter-spacing:.04em;padding:4px 6px;z-index:2}
#out.err{color:#ffb86b}
#st{font-size:11px;letter-spacing:.3em;padding:4px 0;z-index:2}
.chips{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:640px;padding:4px 0;z-index:2;scrollbar-width:none}
.chips .b{white-space:nowrap;border-radius:14px;padding:6px 12px;letter-spacing:.06em}
.row{display:flex;gap:8px;width:100%;max-width:640px;padding:4px 0 12px;z-index:2}
#talk{flex:1;padding:14px;font-size:13px;letter-spacing:.25em}
#txt{flex:2;background:rgba(43,212,255,.05);border:1px solid var(--c2);color:#d6f6ff;padding:0 12px;font-size:15px;border-radius:2px;outline:none;min-width:0}
#txt:focus,.b:focus-visible{border-color:var(--c);box-shadow:0 0 10px rgba(43,212,255,.4)}
.ov{position:fixed;inset:0;background:rgba(2,6,12,.95);display:none;z-index:9;padding:20px;overflow-y:auto}
.ov.show{display:block}
.card{max-width:520px;margin:0 auto;border:1px solid var(--c2);padding:18px;border-radius:3px}
.card h2{font-size:15px;letter-spacing:.2em;margin-bottom:14px;font-weight:600}
label{display:block;font-size:12px;letter-spacing:.08em;margin:14px 0 6px;opacity:.85}
input[type=text],select{width:100%;background:#04101a;border:1px solid var(--c2);color:#d6f6ff;padding:11px;font-size:14px;border-radius:2px}
input[type=range]{width:100%;accent-color:var(--c)}
.hint{font-size:11px;opacity:.6;margin-top:6px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .b{flex:1}
.m{margin:8px 0;padding:8px 10px;font-size:13px;line-height:1.5;border-left:2px solid var(--c2)}
.m.u{border-color:var(--c);color:#d6f6ff;background:rgba(43,212,255,.06)}
.m small{display:block;opacity:.5;font-size:10px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
<button class="b on" id="bSys">SYSTEM ON</button>
<button class="b" id="bJar">JARVIS MODE OFF</button>
<button class="b" id="bVoice">VOICE</button>
<button class="b" id="bLog">LOG</button>
</div>
<div id="net"></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="out"></div>
<div id="st">STANDBY</div>
<div class="chips" id="chips"></div>
<div class="row">
<input id="txt" type="text" placeholder="Type karo..." autocomplete="off" enterkeyhint="send">
<button class="b" id="talk">TAP TO TALK</button>
</div>

<div class="ov" id="panel"><div class="card">
<h2>VOICE &amp; CONNECTION</h2>
<label>Worker URL (AI answer yahin se aata hai)</label>
<input type="text" id="wUrl" placeholder="https://jarvis.xxxx.workers.dev">
<label>Voice</label>
<select id="vSel"></select>
<label>Mic language</label>
<select id="lSel">
<option value="en-IN">English / Hinglish (Roman me likhega)</option>
<option value="hi-IN">Hindi (Devanagari)</option>
</select>
<label>Speed: <span id="rv"></span></label>
<input type="range" id="vRate" min="0.6" max="1.4" step="0.05">
<label>Pitch (kam = bhaari awaaz): <span id="pv"></span></label>
<input type="range" id="vPitch" min="0.4" max="1.4" step="0.05">
<p class="hint">Auto = male voice khud dhoondhega. Awaaz browser ki hai, to free aur unlimited hai.</p>
<div class="acts"><button class="b" id="vTest">TEST</button><button class="b on" id="vSave">SAVE</button></div>
</div></div>

<div class="ov" id="logp"><div class="card">
<h2>CONVERSATION LOG</h2>
<div id="logs"></div>
<div class="acts"><button class="b" id="logClr">CLEAR</button><button class="b on" id="logX">CLOSE</button></div>
</div></div>

<script>
window.addEventListener("error", function (e) {
  var o = document.getElementById("out");
  if (o) { o.className = "err"; o.textContent = "Script error: " + e.message + " (line " + e.lineno + ", " + String(e.filename).split("/").pop() + ")"; }
});
</script>
<script src="core.js"></script>
  <script src="orb.js"></script>
<script src="app.js"></script>
</body>
</html>
<!-- END index.html -->
