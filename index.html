<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<title>JARVIS</title>
<style>
:root{--bg:#02060c;--c:#2bd4ff;--c2:#0b6fa8;--t:#8fdcff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.bar{display:flex;gap:6px;padding:12px 0 4px;flex-wrap:wrap;justify-content:center;z-index:3}
.b{background:transparent;border:1px solid var(--c2);color:var(--t);padding:8px 11px;font-size:11px;letter-spacing:.12em;cursor:pointer;border-radius:2px;transition:.2s}
.b.on{border-color:var(--c);box-shadow:0 0 14px rgba(43,212,255,.5);background:rgba(43,212,255,.08);color:#d6f6ff}
.b:disabled{opacity:.35}
#net{font-size:10px;letter-spacing:.2em;color:#ffb86b;height:12px;z-index:3}
#stage{flex:1;width:100%;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#out{width:100%;max-width:640px;min-height:72px;max-height:21vh;overflow-y:auto;text-align:center;font-size:14px;line-height:1.5;letter-spacing:.04em;padding:4px 6px;z-index:2}
#out.err{color:#ffb86b}
#st{font-size:11px;letter-spacing:.3em;padding:4px 0;z-index:2}
.chips{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:640px;padding:4px 0;z-index:2;scrollbar-width:none}
.chips .b{white-space:nowrap;border-radius:14px;padding:6px 12px;letter-spacing:.06em}
.row{display:flex;gap:8px;width:100%;max-width:640px;padding:4px 0 12px;z-index:2}
#talk{flex:1;padding:14px;font-size:13px;letter-spacing:.25em}
#txt{flex:2;background:rgba(43,212,255,.05);border:1px solid var(--c2);color:#d6f6ff;padding:0 12px;font-size:15px;border-radius:2px;outline:none;min-width:0}
#txt:focus,.b:focus-visible{border-color:var(--c);box-shadow:0 0 10px rgba(43,212,255,.4)}
.ov{position:fixed;inset:0;background:rgba(2,6,12,.95);display:none;z-index:9;padding:20px;overflow-y:auto}
.ov.show{display:block}
.card{max-width:520px;margin:0 auto;border:1px solid var(--c2);padding:18px;border-radius:3px}
.card h2{font-size:15px;letter-spacing:.2em;margin-bottom:14px;font-weight:600}
label{display:block;font-size:12px;letter-spacing:.08em;margin:14px 0 6px;opacity:.85}
input[type=text],select{width:100%;background:#04101a;border:1px solid var(--c2);color:#d6f6ff;padding:11px;font-size:14px;border-radius:2px}
input[type=range]{width:100%;accent-color:var(--c)}
.hint{font-size:11px;opacity:.6;margin-top:6px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:18px}.acts .b{flex:1}
.m{margin:8px 0;padding:8px 10px;font-size:13px;line-height:1.5;border-left:2px solid var(--c2)}
.m.u{border-color:var(--c);color:#d6f6ff;background:rgba(43,212,255,.06)}
.m small{display:block;opacity:.5;font-size:10px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <button class="b on" id="bSys">SYSTEM ON</button>
  <button class="b" id="bJar">JARVIS MODE OFF</button>
  <button class="b" id="bVoice">VOICE</button>
  <button class="b" id="bLog">LOG</button>
</div>
<div id="net"></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="out"></div>
<div id="st">STANDBY</div>
<div class="chips" id="chips"></div>
<div class="row">
  <input id="txt" type="text" placeholder="Type karo..." autocomplete="off" enterkeyhint="send">
  <button class="b" id="talk">TAP TO TALK</button>
</div>

<div class="ov" id="panel"><div class="card">
  <h2>VOICE &amp; CONNECTION</h2>
  <label>Worker URL (AI answer yahin se aata hai)</label>
  <input type="text" id="wUrl" placeholder="https://jarvis.xxxx.workers.dev">
  <label>Voice</label><select id="vSel"></select>
  <label>Mic language</label>
  <select id="lSel"><option value="en-IN">English / Hinglish (Roman me likhega)</option><option value="hi-IN">Hindi (Devanagari)</option></select>
  <label>Speed: <span id="rv"></span></label>
  <input type="range" id="vRate" min="0.6" max="1.4" step="0.05">
  <label>Pitch (kam = bhaari awaaz): <span id="pv"></span></label>
  <input type="range" id="vPitch" min="0.4" max="1.4" step="0.05">
  <p class="hint">Auto = male voice khud dhoondhega. Awaaz browser ki hai, to free aur unlimited hai.</p>
  <div class="acts"><button class="b" id="vTest">TEST</button><button class="b on" id="vSave">SAVE</button></div>
</div></div>

<div class="ov" id="logp"><div class="card">
  <h2>CONVERSATION LOG</h2>
  <div id="logs"></div>
  <div class="acts"><button class="b" id="logClr">CLEAR</button><button class="b on" id="logX">CLOSE</button></div>
</div></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const out=$("out"),st=$("st"),cv=$("cv"),ctx=cv.getContext("2d");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=Object.assign({worker:"",voice:"auto",rate:.95,pitch:.75,lang:"en-IN"},load("jarvis_cfg",{}));
let notes=load("jarvis_notes",[]),rem=load("jarvis_rem",[]),log=load("jarvis_log",[]);
let sysOn=true,jarvis=false,state="idle",rec=null,listening=false,history=[],voices=[],lock=null;

/* ---------- ORB ---------- */
let W=0,H=0,P=[],E=0,target=.25,rot=0;
function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function init(){P=[];for(let i=0;i<190;i++){const u=Math.random()*2-1,a=Math.random()*6.283,s=Math.sqrt(1-u*u),R=.78+Math.random()*.22;P.push({x:s*Math.cos(a)*R,y:u*R,z:s*Math.sin(a)*R})}}
function draw(t){
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=Math.min(W,H)*.46,k0=sysOn?1:.15;
  E+=(target-E)*.06;rot+=.0025+E*.01;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*(.55+E*.25));
  g.addColorStop(0,"rgba(190,245,255,"+.9*k0+")");g.addColorStop(.35,"rgba(43,212,255,"+.55*k0+")");g.addColorStop(1,"rgba(43,212,255,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*(.6+E*.25+Math.sin(t/500)*.02),0,6.283);ctx.fill();
  const cr=Math.cos(rot),sr=Math.sin(rot),pts=[];
  for(const p of P){const x=p.x*cr-p.z*sr,z=p.x*sr+p.z*cr,k=1/(1.9-z*.5);pts.push({x:cx+x*R*k*1.5,y:cy+p.y*R*k*1.5,a:.25+(z+1)*.35})}
  ctx.lineWidth=.7;
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j+=3){
    const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;
    if(d<2600){ctx.strokeStyle="rgba(43,212,255,"+(1-d/2600)*.35*k0+")";ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke()}
  }
  for(const p of pts){ctx.fillStyle="rgba(120,230,255,"+p.a*k0+")";ctx.fillRect(p.x,p.y,2,2)}
  requestAnimationFrame(draw)
}
function setState(s,label){state=s;st.textContent=label||s.toUpperCase();target=!sysOn?.05:s==="speaking"?.9:s==="listening"?.6:s==="thinking"?.45:.25}
addEventListener("resize",size);size();init();requestAnimationFrame(draw);

/* ---------- OUTPUT + LOG ---------- */
let tw=0;
function show(t,isErr){clearInterval(tw);out.className=isErr?"err":"";out.textContent="";let i=0;tw=setInterval(()=>{out.textContent=t.slice(0,i+=3);out.scrollTop=out.scrollHeight;if(i>=t.length)clearInterval(tw)},16)}
function addLog(r,t){log.push({r,t,ts:Date.now()});log=log.slice(-60);put("jarvis_log",log)}
function renderLog(){
  const box=$("logs");box.textContent="";
  if(!log.length){box.textContent="Abhi koi baat-cheet nahi hui.";return}
  log.forEach(m=>{const d=document.createElement("div");d.className="m "+m.r;d.textContent=m.t;const s=document.createElement("small");s.textContent=new Date(m.ts).toLocaleString("en-IN",{hour:"numeric",minute:"2-digit",day:"numeric",month:"short"});d.appendChild(s);box.appendChild(d)});
  box.parentNode.parentNode.scrollTop=1e6
}

/* ---------- VOICE (browser TTS, sentence-chunked) ---------- */
function loadVoices(){voices=speechSynthesis.getVoices();const s=$("vSel");s.innerHTML="";const a=document.createElement("option");a.value="auto";a.textContent="Auto (male)";s.appendChild(a);voices.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o)});s.value=cfg.voice}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){
  if(cfg.voice!=="auto"){const v=voices.find(v=>v.name===cfg.voice);if(v)return v}
  const male=/male|madhur|ravi|hemant|david|rishi|prabhat|guy|daniel|james|alex/i;
  for(const f of [v=>/en-IN|hi-IN/i.test(v.lang),v=>/^en/i.test(v.lang)]){const v=voices.find(v=>f(v)&&male.test(v.name)&&!/female/i.test(v.name));if(v)return v}
  return voices.find(v=>/en-IN|hi-IN/i.test(v.lang))||voices[0]||null
}
function speak(text,done){
  if(!("speechSynthesis" in window)){done&&done();return}
  speechSynthesis.cancel();
  const parts=text.replace(/[*_`#]/g,"").replace(/https?:\/\/\S+/g,"link").split(/(?<=[.!?।])\s+/).filter(Boolean),v=pickVoice();
  let n=0;const finish=()=>{setState("idle",jarvis?"LISTENING FOR 'HEY JARVIS'":"STANDBY");done&&done()};
  (function next(){
    if(n>=parts.length)return finish();
    const u=new SpeechSynthesisUtterance(parts[n++]);
    if(v){u.voice=v;u.lang=v.lang}else u.lang="en-IN";
    u.rate=+cfg.rate;u.pitch=+cfg.pitch;
    if(n===1)u.onstart=()=>setState("speaking","SPEAKING");
    u.onend=next;u.onerror=finish;
    speechSynthesis.speak(u)
  })()
}
function say(text,isErr){show(text,isErr);if(!isErr)addLog("j",text);stopRec();speak(text,()=>{if(jarvis&&sysOn)startRec(true)})}

/* ---------- LIVE DATA ---------- */
const WMO={0:"saaf aasmaan",1:"mostly saaf",2:"thode badal",3:"badal chhaye hue",45:"kohra",48:"kohra",51:"halki boondabandi",53:"boondabandi",55:"tez boondabandi",61:"halki baarish",63:"baarish",65:"tez baarish",71:"barfbari",80:"baarish ki bauchhaar",81:"baarish ki bauchhaar",82:"tez bauchhaar",95:"garaj ke saath toofan",96:"toofan aur ole",99:"toofan aur ole"};
function getWeather(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error("Location support nahi hai, Sir."));
    navigator.geolocation.getCurrentPosition(async p=>{
      try{
        const c=(await (await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude+"&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto")).json()).current;
        res("Sir, abhi temperature "+Math.round(c.temperature_2m)+" degree hai, "+(WMO[c.weather_code]||"mausam theek hai")+". Humidity "+c.relative_humidity_2m+" percent aur hawa "+Math.round(c.wind_speed_10m)+" kilometre per hour.")
      }catch(e){rej(e)}
    },()=>rej(new Error("Location permission do, Sir.")),{timeout:9000})
  })
}
async function wiki(q){
  const s=await (await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch="+encodeURIComponent(q))).json();
  const hit=s.query&&s.query.search[0];if(!hit)throw new Error("Kuch nahi mila, Sir.");
  const d=await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(hit.title))).json();
  return d.extract.split(". ").slice(0,3).join(". ")+"."
}
const CUR={dollar:"USD",dollars:"USD",usd:"USD",euro:"EUR",euros:"EUR",eur:"EUR",pound:"GBP",pounds:"GBP",gbp:"GBP",rupee:"INR",rupees:"INR",rupaye:"INR",inr:"INR",yen:"JPY",jpy:"JPY",dirham:"AED",aed:"AED"};
async function currency(n,a,b){
  const f=CUR[a],t=CUR[b];
  const d=await (await fetch("https://open.er-api.com/v6/latest/"+f)).json();
  if(!d.rates||!d.rates[t])throw new Error("Rate nahi mil paya, Sir.");
  return n+" "+f+" matlab lagbhag "+(n*d.rates[t]).toFixed(2)+" "+t+" hai, Sir."
}
function calc(l){
  let e=l.replace(/(\d+(?:\.\d+)?)\s*(?:%|percent)\s*of\s*(\d+(?:\.\d+)?)/g,"($1/100*$2)")
   .replace(/divided by|bata/g,"/").replace(/multiplied by|times|into/g,"*").replace(/plus/g,"+").replace(/minus/g,"-")
   .replace(/(\d)\s*[x×]\s*(\d)/g,"$1*$2").replace(/÷/g,"/").replace(/\^/g,"**").replace(/[^0-9+\-*/().% ]/g,"");
  if(!/\d/.test(e))return null;
  let r;try{r=Function('"use strict";return ('+e+')')()}catch(x){return null}
  return isFinite(r)?"Sir, jawab hai "+Math.round(r*1e6)/1e6+".":null
}

/* ---------- REMINDERS ---------- */
const saveRem=()=>put("jarvis_rem",rem);
function fire(r){
  const t="Sir, yaad dila raha hoon: "+r.text;
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
  try{if("Notification" in window&&Notification.permission==="granted")new Notification("JARVIS",{body:r.text})}catch(e){}
  sysOn?say(t):show(t)
}
setInterval(()=>{const n=Date.now(),due=rem.filter(r=>r.at<=n);if(due.length){rem=rem.filter(r=>r.at>n);saveRem();due.forEach(fire)}},2000);

/* ---------- AI (Worker) with timeout + retry ---------- */
const LIVE=/latest|news|aaj|today|current|abhi|score|price|rate|cricket|result|khabar|trending|2025|2026/i;
async function askAI(q){
  if(!cfg.worker){panel(true);throw new Error("Pehle VOICE me Worker URL daalo, Sir.")}
  const body=JSON.stringify({message:q,prompt:q,history:history.slice(-8),live:LIVE.test(q),search:LIVE.test(q),
    system:"You are JARVIS, a witty, loyal AI butler. Reply in Hinglish (Roman script), 1-3 short sentences, address the user as Sir. Use live web info for latest/current questions."});
  let last;
  for(let i=0;i<2;i++){
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);
    try{
      const r=await fetch(cfg.worker,{method:"POST",headers:{"Content-Type":"application/json"},body,signal:ac.signal});
      clearTimeout(to);
      if(!r.ok)throw new Error("Server error "+r.status);
      const d=await r.json();
      const t=d.reply||d.text||d.answer||d.response||d.message||(d.candidates&&d.candidates[0]&&d.candidates[0].content.parts.map(p=>p.text).join(""));
      if(!t)throw new Error("Khaali jawab aaya");
      return t
    }catch(e){clearTimeout(to);last=e.name==="AbortError"?new Error("Server ne der kar di, Sir."):e;await new Promise(r=>setTimeout(r,700))}
  }
  throw last
}

/* ---------- COMMANDS ---------- */
const SITES={youtube:"https://www.youtube.com",google:"https://www.google.com",maps:"https://www.google.com/maps",whatsapp:"https://web.whatsapp.com",gmail:"https://mail.google.com",instagram:"https://www.instagram.com",facebook:"https://www.facebook.com"};
const JOKES=["Sir, WiFi aur main me ek cheez common hai: dono tabhi yaad aate hain jab disconnect ho jaayein.","Programmer ki biwi boli: bazaar se ek dahi laana, aur agar ande dikhein to 6 le aana. Wo 6 dahi le aaya, kyunki ande the.","Sir, mere paas bug nahi hote, sirf unexpected features hote hain."];
const UNIT="(sec(?:ond)?s?|min(?:ute)?s?|ghant[ae]|hours?|hrs?)";
async function handle(raw){
  const q=raw.trim();if(!q||!sysOn)return;
  const l=q.toLowerCase();
  show("> "+q);addLog("u",q);setState("thinking","PROCESSING");
  try{
    let m;
    if(/^(stop|chup|ruko|bas|shut up|quiet)\b/.test(l)){speechSynthesis.cancel();return setState("idle",jarvis?"LISTENING FOR 'HEY JARVIS'":"STANDBY")}
    if(/(kitne baje|time kya|what.?s the time|current time|samay)/.test(l))return say("Sir, abhi "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true})+" ho rahe hain.");
    if(/(\bdate\b|tarikh|aaj kya din|which day|what day)/.test(l))return say("Sir, aaj "+new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" hai.");
    if(/(weather|mausam|temperature|tapman)/.test(l))return say(await getWeather());
    if(/battery/.test(l)){
      if(!navigator.getBattery)return say("Is browser me battery info nahi milti, Sir.");
      const b=await navigator.getBattery();return say("Sir, battery "+Math.round(b.level*100)+" percent hai"+(b.charging?" aur charging chal rahi hai.":"."))
    }
    if(/history (clear|delete)|chat (clear|delete)/.test(l)){history=[];log=[];put("jarvis_log",log);return say("Baat-cheet ki history saaf kar di, Sir.")}
    m=l.match(/(\d+(?:\.\d+)?)\s*([a-z]+)\s*(?:to|in|ko|me|se)\s*([a-z]+)/);
    if(m&&CUR[m[2]]&&CUR[m[3]])return say(await currency(+m[1],m[2],m[3]));
    if(/(\d\s*(?:[+\-*/x×÷^]|plus|minus|times|into|divided by|multiplied by)\s*\d)|calculate|percent of|% of/.test(l)){const r=calc(l);if(r)return say(r)}
    m=l.match(new RegExp("(\\d+)\\s*"+UNIT));
    if(m&&/remind|yaad|timer|alarm/.test(l)){
      const n=+m[1],u=/^sec/.test(m[2])?1:/^m/.test(m[2])?60:3600;
      const text=l.replace(m[0],"").replace(/\b(remind me|remind|yaad dila(?:o|na)?|yaad|timer|alarm|set|karo|baad|later|after|in|to|ke liye|for|me|ka|ki|ek)\b/g," ").replace(/\s+/g," ").trim()||"samay poora ho gaya";
      rem.push({at:Date.now()+n*u*1000,text});saveRem();
      try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
      return say("Theek hai Sir, "+m[1]+" "+m[2]+" baad yaad dila dunga.")
    }
    m=l.match(/(?:note karo|note kar lo|note this|remember|yaad rakho|note:)\s*(.+)/);
    if(m){notes.push({t:m[1],ts:Date.now()});put("jarvis_notes",notes);return say("Note kar liya, Sir.")}
    if(/(mere notes|show notes|read notes|notes padho|notes dikhao)/.test(l)){
      if(!notes.length)return say("Abhi koi note nahi hai, Sir.");
      return say("Aapke "+notes.length+" notes hain. "+notes.slice(-3).map((n,i)=>(i+1)+". "+n.t).join(". "))
    }
    if(/notes (clear|delete)|saare notes/.test(l)&&/clear|delete|hata/.test(l)){notes=[];put("jarvis_notes",notes);return say("Saare notes hata diye, Sir.")}
    if(/joke|chutkula|hasao/.test(l))return say(JOKES[Math.floor(Math.random()*JOKES.length)]);
    if(/coin|sikka|toss/.test(l))return say(Math.random()<.5?"Heads aaya, Sir.":"Tails aaya, Sir.");
    if(/dice|paasa|ludo/.test(l))return say("Paase par "+(1+Math.floor(Math.random()*6))+" aaya, Sir.");
    m=l.match(/(?:open|kholo|khol do|chalu karo)\s+(\w+)|(\w+)\s+(?:kholo|khol do|open karo)/);
    const site=m&&(m[1]||m[2]);
    if(site&&SITES[site]){window.open(SITES[site],"_blank");return say(site+" khol raha hoon, Sir.")}
    m=l.match(/(?:search|google|dhundo|khojo)\s+(?:karo\s+|for\s+)?(.+)/);
    if(m&&!/news|latest|aaj|today/.test(l)){window.open("https://www.google.com/search?q="+encodeURIComponent(m[1]),"_blank");return say("Google par "+m[1]+" search kar diya, Sir.")}
    m=l.match(/(?:youtube par|youtube pe|play)\s+(.+)/);
    if(m){window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(m[1]),"_blank");return say("YouTube par "+m[1]+" dhundh raha hoon.")}
    m=l.match(/(?:map|route|directions?|raasta)\D*(?:to|for|ka|ke liye)?\s+(.+)/);
    if(m&&/map|route|direction|raasta/.test(l)){window.open("https://www.google.com/maps/search/"+encodeURIComponent(m[1]),"_blank");return say("Maps me "+m[1]+" khol diya, Sir.")}
    m=l.match(/(?:wikipedia|wiki)\s+(?:par\s+|for\s+)?(.+)/);
    if(m)return say(await wiki(m[1]));
    if(!navigator.onLine)return say("Internet band hai, Sir. Offline commands hi chalenge.",true);
    let ans;
    try{ans=await askAI(q)}
    catch(e){
      if(!cfg.worker)throw e;
      try{ans="AI abhi busy hai, Sir, par Wikipedia ke mutabik: "+await wiki(q.replace(/^(who is|what is|kaun hai|kya hai)\s*/i,""))}
      catch(_){throw e}
    }
    history.push({role:"user",text:q},{role:"model",text:ans});
    say(ans)
  }catch(e){say(e.message||"Kuch gadbad ho gayi, Sir.",true)}
}
