<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--c:40,170,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#03070b;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:rgb(var(--c));letter-spacing:3px;font-size:12px}
#tx{margin:0 24px 6px;letter-spacing:1px;font-size:13px;opacity:.8;min-height:16px}
button,select{background:transparent;color:rgb(var(--c));border:1px solid rgb(var(--c));letter-spacing:2px;font-size:11px;border-radius:2px;font-family:inherit}
button{padding:12px 22px}
#mic{margin-top:12px;padding:12px 26px;letter-spacing:3px;font-size:12px}
.top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:8px;justify-content:center}
.top button{padding:9px 10px;font-size:10px;letter-spacing:1.5px;flex:0 1 auto}
button.on{background:rgba(var(--c),.18);box-shadow:0 0 12px rgba(var(--c),.6)}
button:disabled{opacity:.35}
#panel{position:fixed;left:0;right:0;bottom:0;background:rgba(3,10,16,.96);border-top:1px solid rgb(var(--c));padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));color:rgb(var(--c));font-size:11px;letter-spacing:2px;transform:translateY(105%);transition:transform .25s}
#panel.open{transform:none}
#panel label{display:block;margin-bottom:12px}
#panel select,#panel input{display:block;width:100%;margin-top:6px;box-sizing:border-box;accent-color:rgb(var(--c))}
#panel select{padding:10px;background:#03070b}
#panel input[type=text]{padding:10px;background:#03070b;color:rgb(var(--c));border:1px solid rgb(var(--c));border-radius:2px;font-size:12px;letter-spacing:0}
#panel{max-height:88vh;overflow:auto}
.row{display:flex;gap:8px}.row button{flex:1}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <button id="pw">SYSTEM OFF</button>
  <button id="jm">JARVIS MODE OFF</button>
  <button id="vs">VOICE</button>
</div>
<div class="ui"><div id="tx"></div><div id="st">OFFLINE</div><button id="mic">TAP TO TALK</button></div>

<div id="panel">
  <label>WORKER URL<input type="text" id="api" placeholder="https://jarvis.xxxx.workers.dev" autocapitalize="off" autocomplete="off"></label>
  <label>VOICE<select id="vo"></select></label>
  <label>SPEED <span id="spv"></span><input type="range" id="sp" min="0.6" max="1.6" step="0.05"></label>
  <label>PITCH <span id="piv"></span><input type="range" id="pi" min="0.5" max="1.8" step="0.05"></label>
  <label>MIC LANGUAGE<select id="la"><option value="en-IN">English / Hinglish (en-IN)</option><option value="hi-IN">Hindi (hi-IN)</option><option value="en-US">English (en-US)</option></select></label>
  <div class="row"><button id="test">TEST VOICE</button><button id="close">CLOSE</button></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),root=document.documentElement;
let W,H,R,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);R=Math.min(W*0.46,H*0.36)}
addEventListener('resize',size);size();

const N=2600,P=[];
for(let i=0;i<N;i++){
  const u=Math.random()*2-1,a=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u),q=Math.random();
  let r,fy=1;
  if(q<0.45){r=0.9+Math.random()*0.1;fy=0.45}
  else if(q<0.7){r=0.9+Math.random()*0.1}
  else if(q<0.9){r=0.45+Math.random()*0.3}
  else{r=Math.random()*0.25}
  P.push({x:s*Math.cos(a)*r,y:u*r*fy,z:s*Math.sin(a)*r,r,streak:Math.random()<0.3,ph:Math.random()*6.28,core:q>=0.9});
}

const NODES=P.filter(p=>!p.streak&&p.r>0.4).slice(0,150),E=[];
NODES.forEach((a,i)=>{
  const d=NODES.map((b,j)=>[j,(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2]).filter(o=>o[0]!==i).sort((m,n)=>m[1]-n[1]).slice(0,3);
  d.forEach(o=>{if(!E.some(e=>(e[0]===i&&e[1]===o[0])||(e[0]===o[0]&&e[1]===i)))E.push([i,o[0],Math.random()])});
});
function proj(p,ca,sa,ct,stl,cx,cy){
  const x1=p.x*ca+p.z*sa,z1=-p.x*sa+p.z*ca,y1=p.y*ct-z1*stl,z2=p.y*stl+z1*ct,k=3/(3-z2);
  return [cx+x1*R*k,cy+y1*R*k,z2,k];
}

// ---- Settings (saved in browser) ----
const $=id=>document.getElementById(id);
let cfg={api:'',voice:'',rate:1,pitch:1,lang:'en-IN'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('jarvis_cfg')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('jarvis_cfg',JSON.stringify(cfg))}catch(e){}}

let voices=[];
function loadVoices(){
  voices=speechSynthesis.getVoices();
  const sel=$('vo');sel.innerHTML='';
  const def=document.createElement('option');def.value='';def.textContent='Auto (Hindi / default)';sel.appendChild(def);
  voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
  sel.value=cfg.voice;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$('api').value=cfg.api;$('sp').value=cfg.rate;$('pi').value=cfg.pitch;$('la').value=cfg.lang;
function showVals(){$('spv').textContent=cfg.rate+'x';$('piv').textContent=cfg.pitch}
showVals();
$('api').oninput=e=>{cfg.api=e.target.value.trim();save()};
$('vo').onchange=e=>{cfg.voice=e.target.value;save()};
$('sp').oninput=e=>{cfg.rate=+e.target.value;showVals();save()};
$('pi').oninput=e=>{cfg.pitch=+e.target.value;showVals();save()};
$('la').onchange=e=>{cfg.lang=e.target.value;save()};
$('vs').onclick=()=>$('panel').classList.toggle('open');
$('close').onclick=()=>$('panel').classList.remove('open');
$('test').onclick=()=>speak('Namaste, main Jarvis hoon. Aapki awaaz settings ready hain.',true);

// ---- Voice assistant ----
const BLUE=[40,170,255],ORG=[255,140,20];
let t=0,pwr=0,ang=0,state='idle',history=[],sysOn=false,jarvis=false,rec=null;
const st=$('st'),mic=$('mic'),tx=$('tx');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const LABEL={idle:'STANDBY',listen:'LISTENING...',think:'THINKING...',speak:'SPEAKING...'};

$('pw').onclick=()=>setSystem(!sysOn);
$('jm').onclick=()=>setJarvis(!jarvis);

function setSystem(on){
  sysOn=on;
  $('pw').textContent=on?'SYSTEM ON':'SYSTEM OFF';$('pw').classList.toggle('on',on);
  if(on){state='idle';tx.textContent='';speak('System online. Main taiyaar hoon.',true)}
  else{setJarvis(false);stopAll();tx.textContent=''}
}
function setJarvis(on){
  if(on&&!sysOn){tx.textContent='Pehle SYSTEM ON karo';return}
  jarvis=on;
  $('jm').textContent=on?'JARVIS MODE ON':'JARVIS MODE OFF';$('jm').classList.toggle('on',on);
  if(on){tx.textContent='Hands-free mode: bolte raho, main sunta rahunga';if(state==='idle')listen()}
  else if(state==='listen'){stopAll()}
}
function stopAll(){
  try{speechSynthesis.cancel()}catch(e){}
  if(rec){try{rec.abort()}catch(e){}rec=null}
  state='idle';
}

function listen(){
  if(!sysOn)return;
  if(!SR){tx.textContent='Speech recognition not supported. Use Chrome.';jarvis=false;$('jm').classList.remove('on');return}
  const r=new SR();rec=r;r.lang=cfg.lang;r.interimResults=false;
  state='listen';
  r.onresult=e=>{rec=null;ask(e.results[0][0].transcript)};
  r.onerror=e=>{
    rec=null;state='idle';
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){tx.textContent='Mic permission allow karo';setJarvis(false)}
    else if(jarvis&&sysOn)setTimeout(()=>{if(state==='idle')listen()},600);
  };
  r.onend=()=>{if(state==='listen'){state='idle';rec=null;if(jarvis&&sysOn)setTimeout(()=>{if(state==='idle')listen()},400)}};
  try{r.start()}catch(e){state='idle'}
}

mic.onclick=()=>{
  if(!sysOn){tx.textContent='Pehle SYSTEM ON karo';return}
  if(state!=='idle'){stopAll();return}
  tx.textContent='';listen();
};

async function ask(text){
  if(!cfg.api){state='idle';tx.textContent='Pehle VOICE panel mein Worker URL daalo';$('panel').classList.add('open');return}
  state='think';tx.textContent='YOU: '+text;
  history.push({role:'user',content:text});
  try{
    const res=await fetch(cfg.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-9)})});
    const d=await res.json();
    history.push({role:'assistant',content:d.reply});
    tx.textContent=d.reply;
    speak(d.reply);
  }catch(e){
    history.pop();state='idle';tx.textContent='Connection error';
    if(jarvis&&sysOn)setTimeout(()=>{if(state==='idle')listen()},1500);
  }
}

function speak(txt,force){
  if(!sysOn&&!force)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  const v=voices.find(x=>x.name===cfg.voice);
  if(v){u.voice=v;u.lang=v.lang}else u.lang='hi-IN';
  u.rate=cfg.rate;u.pitch=cfg.pitch;
  const done=()=>{state='idle';if(jarvis&&sysOn)setTimeout(()=>{if(state==='idle')listen()},400)};
  u.onend=done;u.onerror=done;
  state='speak';speechSynthesis.speak(u);
}

// ---- Orb ----
function frame(now){
  const active=sysOn&&state!=='idle';
  t+=((active?1:0)-t)*0.08;
  pwr+=((sysOn?1:0)-pwr)*0.05;
  const pf=0.18+0.82*pwr;
  const rgb=BLUE.map((b,i)=>Math.round(b+(ORG[i]-b)*t)).join(',');
  root.style.setProperty('--c',rgb);
  st.textContent=sysOn?LABEL[state]:'OFFLINE';
  mic.textContent=state!=='idle'?'STOP':'TAP TO TALK';
  mic.disabled=!sysOn;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,7,11,0.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  ang+=(0.003+t*0.005)*(0.2+0.8*pwr);
  const cx=W/2,cy=H*0.42,ca=Math.cos(ang),sa=Math.sin(ang),tl=0.55,ct=Math.cos(tl),stl=Math.sin(tl);
  const pulse=state==='speak'?1+0.04*Math.sin(now/110):1;

  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.38);
  g.addColorStop(0,`rgba(${rgb},${0.55*pf})`);g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*0.7,0,6.28);ctx.fill();

  ctx.strokeStyle=ctx.fillStyle=`rgb(${rgb})`;ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    const p=P[i];
    const x=p.x*pulse,y=p.y*pulse,z=p.z*pulse;
    const x1=x*ca+z*sa,z1=-x*sa+z*ca;
    const y1=y*ct-z1*stl,z2=y*stl+z1*ct;
    const k=3/(3-z2),sx=cx+x1*R*k,sy=cy+y1*R*k;
    const a=Math.max(0.12,(z2+1.2)/2.2)*(p.core?1:0.9)*(0.7+0.3*Math.sin(now/300+p.ph));
    ctx.globalAlpha=Math.min(a,1)*pf;
    if(p.streak){
      const l=Math.hypot(x1,y1)||1,dx=-y1/l*7*k,dy=x1/l*7*k;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+dx,sy+dy);ctx.stroke();
    }else{
      const sz=(p.core?2.2:1.3)*k;
      ctx.fillRect(sx,sy,sz,sz);
    }
  }

  ctx.lineWidth=0.8;
  const pr=NODES.map(n=>proj(n,ca,sa,ct,stl,cx,cy));
  for(const e of E){
    const A=pr[e[0]],B=pr[e[1]],dp=(A[2]+B[2])/2;
    ctx.globalAlpha=Math.max(0.05,(dp+1.2)/2.2)*(0.25+0.35*t)*pf;
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
    const f=((now/(1400-300*t)+e[2])%1);
    ctx.globalAlpha=Math.min(1,0.5+0.5*t)*pf;
    ctx.fillRect(A[0]+(B[0]-A[0])*f-1.5,A[1]+(B[1]-A[1])*f-1.5,3,3);
  }
  ctx.fillStyle=`rgb(${rgb})`;
  for(const A of pr){ctx.globalAlpha=0.9*pf;ctx.beginPath();ctx.arc(A[0],A[1],2*A[3],0,6.28);ctx.fill()}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
